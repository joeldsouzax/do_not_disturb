# This folder is its own pnpm workspace root, so `pnpm install` here installs
# the app's own dependencies even when the folder lives inside another workspace.
packages: []

allowBuilds:
  sharp: true

# The first-party model package may ship on the same day as this example.
# Exempt only the exact reviewed version from pnpm 11's 24-hour release window.
minimumReleaseAgeExclude:
  - "@reactor-models/vidu-s2-avatar@0.4.0"
